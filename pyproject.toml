[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "faultgraph-lab"
version = "0.1.0"
description = "Reproducible static graph-logical fault-tolerance research"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.169.0", "networkx==3.7", "jsonschema==4.26.0", "ruff==0.17.0", "build==1.6.1"]
plots = ["matplotlib==3.11.2"]

[project.scripts]
faultgraph = "faultgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

